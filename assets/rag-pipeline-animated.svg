<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 290" width="100%" height="100%" role="img" aria-label="Animated Google ADK and Hybrid RAG Architecture Pipeline">
  <defs>
    <linearGradient id="cardSand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3ece1"/>
    </linearGradient>
    <linearGradient id="darkNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2b17"/>
      <stop offset="100%" stop-color="#1b1209"/>
    </linearGradient>
    <linearGradient id="goldFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9e712a"/>
      <stop offset="50%" stop-color="#e1b86b"/>
      <stop offset="100%" stop-color="#936722"/>
    </linearGradient>
    <style>
      .bg { fill: #faf6f0; stroke: #dfd3c1; stroke-width: 1.5; }
      .hdr { font: 600 11.5px 'Consolas', 'SFMono-Regular', monospace; fill: #857666; letter-spacing: 1.8px; }
      .node-title { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #1e1915; }
      .node-title-light { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #fff6e8; }
      .node-sub { font: 500 11.5px 'Consolas', 'SFMono-Regular', monospace; fill: #6b5d4f; }
      .node-sub-light { font: 500 11.5px 'Consolas', 'SFMono-Regular', monospace; fill: #edd19c; }
      .wire { fill: none; stroke: #cbb99f; stroke-width: 2.2; }
      .flow { fill: none; stroke: #b88635; stroke-width: 2.6; stroke-dasharray: 10 14; animation: flowAnim 1.4s linear infinite; }
      .guard-pill { font: 700 11px 'Consolas', 'SFMono-Regular', monospace; fill: #7c2d12; }
      @keyframes flowAnim {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1158" height="288" rx="16" class="bg"/>
  <text x="32" y="34" class="hdr">// LIVE REQUEST &amp; HYBRID RAG EXECUTION PIPELINE</text>

  <!-- Connector Paths -->
  <path id="p1" d="M 205 135 L 265 135" class="wire"/>
  <path d="M 205 135 L 265 135" class="flow"/>

  <path id="p2" d="M 445 135 L 505 135" class="wire"/>
  <path d="M 445 135 L 505 135" class="flow"/>

  <path id="p3" d="M 705 135 L 765 135" class="wire"/>
  <path d="M 705 135 L 765 135" class="flow"/>

  <path id="p4" d="M 955 135 L 1005 135" class="wire"/>
  <path d="M 955 135 L 1005 135" class="flow"/>

  <!-- Node 1: Custom DevNext UI -->
  <g transform="translate(30, 82)">
    <rect width="175" height="106" rx="12" fill="url(#cardSand)" stroke="#bfa98b" stroke-width="1.5"/>
    <rect x="14" y="14" width="44" height="20" rx="4" fill="url(#goldFill)"/>
    <text x="21" y="28" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#1c1309">UI</text>
    <text x="14" y="56" class="node-title">DevNext '26 UI</text>
    <text x="14" y="76" class="node-sub">Custom Theme</text>
    <text x="14" y="93" class="node-sub">+ Source Drawer</text>
  </g>

  <!-- Node 2: FastAPI + ADK Runner -->
  <g transform="translate(265, 82)">
    <rect width="180" height="106" rx="12" fill="url(#cardSand)" stroke="#bfa98b" stroke-width="1.5"/>
    <rect x="14" y="14" width="52" height="20" rx="4" fill="#efe4d2" stroke="#bda584"/>
    <text x="21" y="28" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#5e441e">ADK</text>
    <text x="14" y="56" class="node-title">FastAPI + Runner</text>
    <text x="14" y="76" class="node-sub">InMemorySession</text>
    <text x="14" y="93" class="node-sub">POST /api/chat</text>
  </g>

  <!-- Node 3: Gemini 3.8 Flash Agent (Highlighted Centerpiece) -->
  <g transform="translate(505, 72)">
    <rect width="200" height="126" rx="14" fill="url(#darkNode)" stroke="#d9ae62" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.65;1;0.65" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="178" cy="24" r="5" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="16" y="29" class="node-sub-light">// GOOGLE ADK AGENT</text>
    <text x="16" y="58" class="node-title-light">gemini-3.8-flash</text>
    <text x="16" y="81" class="node-sub-light">• Tool Orchestration</text>
    <text x="16" y="100" class="node-sub-light">• Event Scope Lock</text>
  </g>

  <!-- Guardrail Deflection Badge under Agent -->
  <g transform="translate(495, 222)">
    <line x1="110" y1="-24" x2="110" y2="0" stroke="#d97706" stroke-width="1.6" stroke-dasharray="3 3"/>
    <rect width="220" height="34" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="14" y="21" class="guard-pill">🛡️ Declines Non-DevNext Queries</text>
  </g>

  <!-- Node 4: Hybrid RAG Engine -->
  <g transform="translate(765, 82)">
    <rect width="190" height="106" rx="12" fill="url(#cardSand)" stroke="#bfa98b" stroke-width="1.5"/>
    <rect x="14" y="14" width="54" height="20" rx="4" fill="url(#goldFill)"/>
    <text x="22" y="28" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#1c1309">RAG</text>
    <text x="14" y="56" class="node-title">Hybrid Retrieval</text>
    <text x="14" y="76" class="node-sub">gemini-embedding-001</text>
    <text x="14" y="93" class="node-sub">0.70 Vec + 0.30 BM25</text>
  </g>

  <!-- Node 5: Event Knowledge Base -->
  <g transform="translate(1005, 82)">
    <rect width="128" height="106" rx="12" fill="#f3eadb" stroke="#9e7a42" stroke-width="1.6"/>
    <text x="14" y="34" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#825c22">// CORPUS</text>
    <text x="14" y="58" class="node-title">10 Chunks</text>
    <text x="14" y="78" class="node-sub">Speakers, FAQ</text>
    <text x="14" y="94" class="node-sub">CTO Lounge</text>
  </g>

  <!-- Travelling Glowing Data Orbs -->
  <circle r="4.5" fill="#d99b38">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 205 135 L 265 135"/>
  </circle>
  <circle r="4.5" fill="#d99b38">
    <animateMotion dur="1.5s" begin="0.35s" repeatCount="indefinite" path="M 445 135 L 505 135"/>
  </circle>
  <circle r="4.5" fill="#d99b38">
    <animateMotion dur="1.5s" begin="0.7s" repeatCount="indefinite" path="M 705 135 L 765 135"/>
  </circle>
  <circle r="4.5" fill="#d99b38">
    <animateMotion dur="1.5s" begin="1.05s" repeatCount="indefinite" path="M 955 135 L 1005 135"/>
  </circle>
</svg>
